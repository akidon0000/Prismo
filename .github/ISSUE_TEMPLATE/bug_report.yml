name: Bug report
description: 不具合を報告する
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 番号付きで
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: 0.0.1
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動

name: Release

# - main への push で versions/macos が変わったとき（bump PR のマージ）
# - v* タグを手で push したとき
on:
  push:
    branches: [main]
    paths: [versions/macos]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & publish (macOS)
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      HAS_DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          git fetch --tags --force
          PLATFORM=macos
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            case "$VERSION" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "macOS tag must look like v0.0.1, got: $VERSION" >&2; exit 1 ;;
            esac
            SKIP=false
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            BARE="$(tr -d '[:space:]' < versions/macos)"
            case "$BARE" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "versions/macos must look like 0.0.1, got: $BARE" >&2; exit 1 ;;
            esac
            VERSION="v${BARE}"
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "tag ${VERSION} already exists; skipping release" >&2
              SKIP=true
            else
              SKIP=false
            fi
          else
            echo "unsupported ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          {
            echo "platform=${PLATFORM}"
            echo "version=${VERSION}"
            echo "skip=${SKIP}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag main
        if: steps.version.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Show toolchain
        if: steps.version.outputs.skip != 'true'
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: swift test

      - name: Import Developer ID certificate
        if: ${{ steps.version.outputs.skip != 'true' && env.HAS_DEVELOPER_ID_CERT == 'true' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$DEVELOPER_ID_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build & package
        if: steps.version.outputs.skip != 'true'
        run: bash scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Notarize & staple
        if: ${{ steps.version.outputs.skip != 'true' && env.HAS_DEVELOPER_ID_CERT == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$APP_STORE_CONNECT_KEY_PATH"
          export APP_STORE_CONNECT_KEY_PATH
          bash scripts/notarize.sh "${{ steps.version.outputs.version }}"
          rm -f "$APP_STORE_CONNECT_KEY_PATH"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONED_DMG="$(ls dist/Prismo-*.dmg)"
          cp "$VERSIONED_DMG" dist/Prismo-latest.dmg
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Prismo ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "$VERSIONED_DMG" dist/Prismo-latest.dmg

  screenshot:
    name: Refresh README and Site screenshots
    needs: release-macos
    if: needs.release-macos.outputs.skip != 'true'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Render screenshot
        run: bash scripts/screenshot.sh

      - name: Open a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-macos.outputs.version }}
        run: |
          PATHS=(assets/screenshot.png Site/Assets/images/screenshot.png)
          if git diff --quiet -- "${PATHS[@]}"; then
            echo "screenshot is already up to date"
            exit 0
          fi
          BRANCH="cursor/screenshot-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(assets): refresh README/Site screenshot for ${VERSION}" \
            -- "${PATHS[@]}"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(assets): refresh README/Site screenshot for ${VERSION}" \
            --body "Rendered from the real UI at ${VERSION} by \`scripts/screenshot.sh\`. Merge if it looks right." \
            || echo "a PR for $BRANCH is already open"

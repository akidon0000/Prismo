name: Pages

# Site/ を GitHub Pages に公開する。Download は releases/latest 固定 URL。
on:
  push:
    branches: [main]
    paths: ["Site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build download page
        working-directory: Site
        run: swift run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Site/Build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
